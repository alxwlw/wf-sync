packages:
  - apps/*
catalogs:
  dev:
    typescript: 7.1.0-beta
    oxlint: 1.94.0
    oxlint-tsgolint: 7.0.2007
    oxfmt: 0.79.0
    '@types/node': 26.6.6
    '@types/bun': 1.4.4
    knip: 6.45.1
    dependency-cruiser: 18.8.0
    vitest: 5.1.0
    '@playwright/test': 1.65.1
    '@alxwlw/stack': 1.18.2
    '@alxwlw/oxlint-config': 1.18.2
    '@alxwlw/tsconfig': 1.18.2
minimumReleaseAgeExclude:
  - '@alxwlw/oxlint-config@1.7.1 || 1.8.0 || 1.9.0 || 1.9.2 || 1.10.0 || 1.16.0 || 1.16.1 || 1.17.0 || 1.18.0 || 1.18.2'
  - '@alxwlw/stack@1.7.1 || 1.8.0 || 1.9.0 || 1.9.2 || 1.10.0 || 1.16.0 || 1.16.1 || 1.17.0 || 1.18.0 || 1.18.2'
  - '@alxwlw/tsconfig@1.7.1 || 1.8.0 || 1.9.0 || 1.9.2 || 1.10.0 || 1.16.0 || 1.16.1 || 1.17.0 || 1.18.0 || 1.18.2'
  - '@alxwlw/repo-rules@1.17.0 || 1.18.0 || 1.18.2'
# wf-sync: ccxt's postinstall only prints a banner; bufferutil is an optional native addon of ws.
allowBuilds:
  ccxt: false
  bufferutil: false
