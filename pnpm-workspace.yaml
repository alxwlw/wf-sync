packages:
  - apps/*
catalogs:
  dev:
    typescript: 7.1.0-beta
    oxlint: 1.95.0
    oxlint-tsgolint: 7.0.2008
    oxfmt: 0.80.0
    '@types/node': 26.6.6
    '@types/bun': 1.4.5
    knip: 6.48.0
    dependency-cruiser: 18.9.0
    vitest: 5.1.1
    '@playwright/test': 1.65.1
    '@alxwlw/stack': 1.19.0
    '@alxwlw/oxlint-config': 1.19.0
    '@alxwlw/tsconfig': 1.19.0
minimumReleaseAgeExclude:
  - '@alxwlw/oxlint-config@1.7.1 || 1.8.0 || 1.9.0 || 1.9.2 || 1.10.0 || 1.16.0 || 1.16.1 || 1.17.0 || 1.18.0 || 1.18.2 || 1.19.0'
  - '@alxwlw/stack@1.7.1 || 1.8.0 || 1.9.0 || 1.9.2 || 1.10.0 || 1.16.0 || 1.16.1 || 1.17.0 || 1.18.0 || 1.18.2 || 1.19.0'
  - '@alxwlw/tsconfig@1.7.1 || 1.8.0 || 1.9.0 || 1.9.2 || 1.10.0 || 1.16.0 || 1.16.1 || 1.17.0 || 1.18.0 || 1.18.2 || 1.19.0'
  - '@alxwlw/repo-rules@1.17.0 || 1.18.0 || 1.18.2 || 1.19.0'
# wf-sync: ccxt's postinstall only prints a banner; bufferutil is an optional native addon of ws.
allowBuilds:
  ccxt: false
  bufferutil: false
